name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Info.plist

      - name: Build
        run: ./build.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent ClaudeUsage.app ClaudeUsage.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ClaudeUsage.zip --title "$GITHUB_REF_NAME" --generate-notes
